model_list:
  # All Claude model names map to DeepSeek V4 Pro on NVIDIA NIM.
  # Claude Code / agents request claude-opus-4-7 and get DeepSeek transparently.
  - model_name: claude-opus-4-7
    litellm_params:
      model: openai/deepseek-ai/deepseek-v4-pro
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_NIM_API_KEY
    model_info:
      mode: chat

  - model_name: claude-sonnet-4-6
    litellm_params:
      model: openai/deepseek-ai/deepseek-v4-pro
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_NIM_API_KEY
    model_info:
      mode: chat

  - model_name: claude-haiku-4-5
    litellm_params:
      model: openai/deepseek-ai/deepseek-v4-pro
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_NIM_API_KEY
    model_info:
      mode: chat

litellm_settings:
  drop_params: true
  set_verbose: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  port: 4000
