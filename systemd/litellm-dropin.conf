# Drop this into /etc/systemd/system/YOUR-DIRECTOR.service.d/litellm.conf
# then: sudo systemctl daemon-reload && sudo systemctl restart YOUR-DIRECTOR

[Service]
# Clear any UnsetEnvironment directives so ANTHROPIC_API_KEY can reach agents
UnsetEnvironment=
# Load API keys from the litellm env file
EnvironmentFile=/home/YOUR-USERNAME/litellm/.env
# Route all Anthropic requests through local LiteLLM proxy
Environment=ANTHROPIC_BASE_URL=http://localhost:4000
